<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Draw ･ﾟ✧</title>
    <style>
      * {
        box-sizing: border-box;
      }

      html, body {
        height: 100%;
        margin: 0;
      }

      body {
        background-color: #ffffff;
        font-family: 'Segoe UI', Arial, sans-serif;
        overflow: hidden;
      }

      #toolbar {
        position: fixed;
        left: 16px;
        top: 50%;
        transform: translateY(-50%);
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 14px;
        padding: 16px 12px;
        background: rgba(30, 30, 46, 0.85);
        border: 1px solid rgba(205, 214, 244, 0.12);
        border-radius: 20px;
        backdrop-filter: blur(14px);
        -webkit-backdrop-filter: blur(14px);
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.18);
        z-index: 10;
      }

      .color-option {
        width: 26px;
        height: 26px;
        border-radius: 50%;
        cursor: pointer;
        border: 2px solid rgba(205, 214, 244, 0.25);
        transition: transform 0.15s ease, border-color 0.15s ease;
      }

      .color-option:hover {
        transform: scale(1.15);
        border-color: #cdd6f4;
      }

      .color-option.selected {
        border-color: #89b4fa;
        box-shadow: 0 0 0 2px rgba(137, 180, 250, 0.4);
      }

      #color-picker-button {
        width: 26px;
        height: 26px;
        border-radius: 50%;
        border: 2px solid rgba(205, 214, 244, 0.25);
        background: conic-gradient(
          #f38ba8,
          #f9e2af,
          #a6e3a1,
          #94e2d5,
          #89b4fa,
          #cba6f7,
          #f38ba8
        );
        cursor: pointer;
        transition: transform 0.15s ease;
      }

      #color-picker-button:hover {
        transform: scale(1.15);
      }

      .divider {
        width: 24px;
        height: 1px;
        background: rgba(205, 214, 244, 0.15);
      }

      #brush-size-container {
        display: flex;
        justify-content: center;
        align-items: center;
      }

      #brush-size-slider {
        writing-mode: vertical-lr;
        direction: rtl;
        appearance: none;
        width: 6px;
        height: 90px;
        background: rgba(205, 214, 244, 0.15);
        border-radius: 4px;
        cursor: pointer;
        outline: none;
      }

      #brush-size-slider::-webkit-slider-thumb {
        appearance: none;
        width: 18px;
        height: 18px;
        border-radius: 50%;
        background: #89b4fa;
        cursor: pointer;
        border: 2px solid #1e1e2e;
      }

      #brush-size-slider::-moz-range-thumb {
        width: 18px;
        height: 18px;
        border-radius: 50%;
        background: #89b4fa;
        cursor: pointer;
        border: 2px solid #1e1e2e;
      }

      .icon-btn {
        width: 30px;
        height: 30px;
        display: flex;
        align-items: center;
        justify-content: center;
        border-radius: 10px;
        cursor: pointer;
        transition: background 0.15s ease, transform 0.15s ease;
      }

      .icon-btn:hover {
        background: rgba(205, 214, 244, 0.1);
        transform: scale(1.08);
      }

      .icon-btn.active {
        background: rgba(137, 180, 250, 0.25);
      }

      #eraser-btn {
        width: 20px;
        height: 20px;
        object-fit: contain;
        filter: invert(85%) sepia(8%) saturate(400%) hue-rotate(196deg);
      }

      #save-btn {
        width: 18px;
        height: 18px;
        fill: none;
        stroke: #cdd6f4;
        stroke-width: 2;
        stroke-linecap: round;
        stroke-linejoin: round;
      }

      #clear-btn {
        width: 20px;
        height: 20px;
        fill: #f38ba8;
      }

      canvas {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        z-index: 0;
        touch-action: none;
        background-color: #ffffff;
      }

      #warning-dialog {
        position: fixed;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        background: rgba(30, 30, 46, 0.9);
        color: #cdd6f4;
        padding: 24px;
        border: 1px solid rgba(205, 214, 244, 0.12);
        border-radius: 16px;
        backdrop-filter: blur(14px);
        -webkit-backdrop-filter: blur(14px);
        box-shadow: 0 12px 32px rgba(0, 0, 0, 0.35);
        display: none;
        z-index: 1000;
        text-align: center;
        width: 280px;
        font-size: 15px;
      }

      #warning-dialog p {
        margin: 0 0 16px 0;
      }

      #warning-dialog button {
        margin: 0 6px;
        padding: 10px 20px;
        font-size: 14px;
        cursor: pointer;
        border: none;
        border-radius: 10px;
        font-weight: 600;
        transition: opacity 0.15s ease;
      }

      #warning-dialog button:hover {
        opacity: 0.85;
      }

      #warning-dialog button.confirm {
        background-color: #f38ba8;
        color: #1e1e2e;
      }

      #warning-dialog button.cancel {
        background-color: rgba(205, 214, 244, 0.15);
        color: #cdd6f4;
      }
    </style>
    <script>
      window.va = window.va || function () { (window.vaq = window.vaq || []).push(arguments); };
    </script>
    <script defer src="/_vercel/insights/script.js"></script>
  </head>
  <body>
    <div id="toolbar">
      <div id="color-picker-button" onclick="openColorPicker()"></div>
      <input
        type="color"
        id="color-input"
        style="display: none"
        onchange="setColor(this.value)"
      />

      <div class="divider"></div>

      <div
        class="color-option selected"
        data-color="#11111b"
        style="background-color: #11111b"
        onclick="setColor('#11111b', this)"
      ></div>
      <div
        class="color-option"
        data-color="#cdd6f4"
        style="background-color: #cdd6f4"
        onclick="setColor('#cdd6f4', this)"
      ></div>
      <div
        class="color-option"
        data-color="#f38ba8"
        style="background-color: #f38ba8"
        onclick="setColor('#f38ba8', this)"
      ></div>
      <div
        class="color-option"
        data-color="#fab387"
        style="background-color: #fab387"
        onclick="setColor('#fab387', this)"
      ></div>
      <div
        class="color-option"
        data-color="#f9e2af"
        style="background-color: #f9e2af"
        onclick="setColor('#f9e2af', this)"
      ></div>
      <div
        class="color-option"
        data-color="#a6e3a1"
        style="background-color: #a6e3a1"
        onclick="setColor('#a6e3a1', this)"
      ></div>
      <div
        class="color-option"
        data-color="#89b4fa"
        style="background-color: #89b4fa"
        onclick="setColor('#89b4fa', this)"
      ></div>
      <div
        class="color-option"
        data-color="#cba6f7"
        style="background-color: #cba6f7"
        onclick="setColor('#cba6f7', this)"
      ></div>

      <div class="divider"></div>

      <div id="brush-size-container">
        <input
          type="range"
          id="brush-size-slider"
          min="5"
          max="50"
          value="30"
          onchange="setBrushSize(this.value)"
        />
      </div>

      <div class="divider"></div>

      <div id="eraser-btn-container" class="icon-btn" onclick="toggleEraser()">
        <img
          id="eraser-btn"
          src="https://static-00.iconduck.com/assets.00/eraser-icon-256x256-e0q4ms0d.png"
          alt="Eraser"
        />
      </div>

      <div id="clear-btn-container" class="icon-btn" onclick="showWarning()">
        <svg
          id="clear-btn"
          xmlns="http://www.w3.org/2000/svg"
          viewBox="0 0 24 24"
        >
          <path
            d="M3 6h18v2H3zm3 2h12v14H6zm5 1v9h2v-9h-2zm1 0h-2v9h2zM6 7h12v1H6z"
          />
        </svg>
      </div>

      <div id="save-btn-container" class="icon-btn" onclick="saveAsImage()">
        <svg
          id="save-btn"
          xmlns="http://www.w3.org/2000/svg"
          viewBox="0 0 24 24"
        >
          <path d="M12 3v12" />
          <path d="M7 10l5 5 5-5" />
          <path d="M4 19h16" />
        </svg>
      </div>
    </div>

    <canvas id="background"></canvas>

    <div id="warning-dialog">
      <p>Are you sure you want to clear the canvas?</p>
      <button class="confirm" onclick="clearCanvas()">Yes</button>
      <button class="cancel" onclick="cancelClear()">Cancel</button>
    </div>

    <script>
      var canvas = document.getElementById("background");
      var context = canvas.getContext("2d");
      var isDrawing = false;
      var isEraser = false;
      var color = "#11111b";
      var brushSize = 30;
      var canvasHistory = [];
      var historyIndex = -1;

      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;

      if (localStorage.getItem("drawing")) {
        var savedImage = new Image();
        savedImage.src = localStorage.getItem("drawing");
        savedImage.onload = function () {
          context.drawImage(savedImage, 0, 0);
        };
      }

      function setColor(newColor, el) {
        color = newColor;
        document.getElementById("color-picker-button").style.backgroundColor = newColor;
        isEraser = false;
        document.getElementById("eraser-btn-container").classList.remove("active");
        document.querySelectorAll(".color-option").forEach(function (opt) {
          opt.classList.remove("selected");
        });
        if (el) el.classList.add("selected");
      }

      function setBrushSize(size) {
        brushSize = size;
      }

      function toggleEraser() {
        isEraser = !isEraser;
        color = isEraser ? "#ffffff" : color;
        document.getElementById("eraser-btn-container").classList.toggle("active", isEraser);
      }

      canvas.addEventListener("mousedown", function (event) {
        if (event.target.classList.contains("color-option")) return;
        isDrawing = true;
        saveState();
      });

      canvas.addEventListener("mouseup", function () {
        isDrawing = false;
        context.beginPath();
        saveState();
      });

      canvas.addEventListener("mousemove", function (event) {
        if (!isDrawing || event.target.classList.contains("color-option"))
          return;

        var clientX = event.clientX;
        var clientY = event.clientY;

        draw(clientX, clientY);
      });

      canvas.addEventListener("touchstart", function (event) {
        event.preventDefault();
        if (event.target.classList.contains("color-option")) return;
        isDrawing = true;
        saveState();
      });

      canvas.addEventListener("touchend", function () {
        isDrawing = false;
        context.beginPath();
        saveState();
      });

      canvas.addEventListener("touchmove", function (event) {
        event.preventDefault();

        if (!isDrawing || event.target.classList.contains("color-option"))
          return;

        var touch = event.touches[0];
        var clientX = touch.clientX;
        var clientY = touch.clientY;

        draw(clientX, clientY);
      });

      function draw(clientX, clientY) {
        context.lineWidth = brushSize;
        context.lineCap = "round";
        context.strokeStyle = color;

        context.lineTo(clientX, clientY);
        context.stroke();
        context.beginPath();
        context.moveTo(clientX, clientY);
      }

      function saveState() {
        if (historyIndex < canvasHistory.length - 1) {
          canvasHistory = canvasHistory.slice(0, historyIndex + 1);
        }
        canvasHistory.push(canvas.toDataURL());
        historyIndex++;

        localStorage.setItem("drawing", canvas.toDataURL());
      }

      function undo() {
        if (historyIndex > 0) {
          historyIndex--;
          var imgData = new Image();
          imgData.src = canvasHistory[historyIndex];
          imgData.onload = function () {
            context.clearRect(0, 0, canvas.width, canvas.height);
            context.drawImage(imgData, 0, 0);
          };
        }
      }

      function redo() {
        if (historyIndex < canvasHistory.length - 1) {
          historyIndex++;
          var imgData = new Image();
          imgData.src = canvasHistory[historyIndex];
          imgData.onload = function () {
            context.clearRect(0, 0, canvas.width, canvas.height);
            context.drawImage(imgData, 0, 0);
          };
        }
      }

      window.addEventListener("resize", function () {
        var tempCanvas = document.createElement("canvas");
        tempCanvas.width = canvas.width;
        tempCanvas.height = canvas.height;
        tempCanvas.getContext("2d").drawImage(canvas, 0, 0);

        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
        context.drawImage(tempCanvas, 0, 0);
      });

      function showWarning() {
        document.getElementById("warning-dialog").style.display = "block";
      }

      function clearCanvas() {
        context.clearRect(0, 0, canvas.width, canvas.height);
        saveState();
        document.getElementById("warning-dialog").style.display = "none";
        localStorage.removeItem("drawing");
      }

      function cancelClear() {
        document.getElementById("warning-dialog").style.display = "none";
      }

      function saveAsImage() {
        var imageUrl = canvas.toDataURL("image/png");
        var link = document.createElement("a");
        link.href = imageUrl;
        link.download = "drawing.png";
        link.click();
      }

      function openColorPicker() {
        document.getElementById("color-input").click();
      }

      window.addEventListener("keydown", function (event) {
        if (event.ctrlKey && event.key === "z") {
          undo();
        } else if (event.ctrlKey && event.key === "y") {
          redo();
        }
      });
    </script>
  </body>
</html>
