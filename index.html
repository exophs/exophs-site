<!DOCTYPE html>
<html dir="ltr" lang="en">
<head>
<meta charset="utf-8">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#fff">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>exophs.vercel.app</title>
<style>
body {
  --background-color: #fff;
  --error-code-color: rgb(95, 99, 104);
  --google-gray-300: rgb(218, 220, 224);
  --google-gray-500: rgb(154, 160, 166);
  --google-gray-50: rgb(248, 249, 250);
  --google-gray-600: rgb(128, 134, 139);
  --google-gray-700: rgb(95, 99, 104);
  --google-gray-900: rgb(32, 33, 36);
  --heading-color: var(--google-gray-900);
  --link-color: rgb(88, 88, 88);
  --primary-color: #4a46e0;
  --primary-color-hover: #251491;
  --primary-button-fill-color-active: var(--primary-color-hover);
  --primary-button-fill-color: var(--primary-color);
  --primary-button-text-color: #fff;
  --secondary-button-border-color: var(--google-gray-500);
  --secondary-button-fill-color: #fff;
  --secondary-button-hover-border-color: var(--google-gray-600);
  --secondary-button-hover-fill-color: var(--google-gray-50);
  --secondary-button-text-color: var(--google-gray-700);
  --text-color: var(--google-gray-700);
  background: var(--background-color);
  color: var(--text-color);
  margin: 0;
  font-family: 'Segoe UI', Tahoma, sans-serif;
  font-size: 75%;
  overflow: hidden;
  position: relative;
}

@media (prefers-color-scheme: dark) {
  body {
    --background-color: rgb(32, 33, 36);
    --error-code-color: var(--google-gray-500);
    --heading-color: var(--google-gray-500);
    --link-color: rgb(138, 180, 248);
    --primary-color: #c1c4ff;
    --primary-color-hover: #dfe1ff;
    --primary-button-text-color: rgb(32, 33, 36);
    --secondary-button-border-color: var(--google-gray-700);
    --secondary-button-fill-color: rgb(32, 33, 36);
    --secondary-button-hover-fill-color: rgb(48, 51, 57);
    --secondary-button-text-color: rgb(138, 180, 248);
    --text-color: var(--google-gray-500);
  }
}

html { -webkit-text-size-adjust: 100%; font-size: 125%; }

.icon { height: 72px; margin: 0 0 40px; width: 72px; display: inline-block; background-repeat: no-repeat; background-size: 100%;
  content: image-set(url(data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAEgAAABIAQMAAABvIyEEAAAABlBMVEUAAABTU1OoaSf/AAAAAXRSTlMAQObYZgAAAENJREFUeF7tzbEJACEQRNGBLeAasBCza2lLEGx0CxFGG9hBMDDxRy/72O9FMnIFapGylsu1fgoBdkXfUHLrQgdfrlJN1BdYBjQQm3UAAAAASUVORK5CYII=) 1x,
    url(data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAJAAAACQAQMAAADdiHD7AAAABlBMVEUAAABTU1OoaSf/AAAAAXRSTlMAQObYZgAAAFJJREFUeF7t0cENgDAMQ9FwYgxG6WjpaIzCCAxQxVggFuDiCvlLOeRdHR9yzjncHVoq3npu+wQUrUuJHylSTmBaespJyJQoObUeyxDQb3bEm5Au81c0pSCD8HYAAAAASUVORK5CYII=) 2x);
}
@media (prefers-color-scheme: dark) { .icon { filter: invert(1); } }

h1 { color: var(--heading-color); font-size: 1.6em; font-weight: normal; line-height: 1.25em; margin: 0 0 16px; word-wrap: break-word; }
h1 span { font-weight: 500; }
.error-code { color: var(--error-code-color); font-size: .8em; margin-top: 12px; text-transform: uppercase; }

.interstitial-wrapper {
  box-sizing: border-box; font-size: 1em; line-height: 1.6em; margin: 14vh auto 0; max-width: 600px; width: 100%; position: relative; z-index: 1;
}
#main-message > p { display: inline; margin: 0; }
.nav-wrapper { margin-top: 51px; }
.nav-wrapper::after { clear: both; content: ''; display: table; width: 100%; }
.suggested-left > #control-buttons { float: left; }

button {
  background: var(--primary-button-fill-color); border: 0; border-radius: 20px; box-sizing: border-box;
  color: var(--primary-button-text-color); cursor: pointer; float: right; font-size: .875em; margin: 0;
  padding: 9px; transition: box-shadow 150ms cubic-bezier(0.4, 0, 0.2, 1); user-select: none;
}
button:active { background: var(--primary-button-fill-color-active); outline: 0; }

@media (max-width: 420px) {
  button { float: none; font-size: .825em; font-weight: 500; width: 100%; padding: 16px 24px; }
  .interstitial-wrapper { padding: 0 5%; margin: 7vh auto 12px; }
  h1 { font-size: 1.5em; margin-bottom: 8px; }
  .icon { margin-bottom: 5.69vh; }
  .nav-wrapper { margin-top: 30px; }
}

/* Main Trollface */
#trollface {
  position: fixed;
  bottom: -100%;
  left: 50%;
  transform: translateX(-50%);
  width: 0;
  height: auto;
  max-width: 90vw;
  z-index: 10;
  opacity: 0;
  transition: all 4s cubic-bezier(0.25, 0.1, 0.25, 1);
  pointer-events: none;
}
#trollface.show {
  bottom: 10%;
  width: 500px;
  opacity: 1;
}
#trollface.dancing {
  animation: trollDance 2.8s infinite alternate ease-in-out;
  width: 420px;
}

@keyframes trollDance {
  0%   { transform: translate(-50%, 0) rotate(-12deg) scale(1); }
  25%  { transform: translate(calc(-50% + 180px), -80px) rotate(8deg) scale(1.08); }
  50%  { transform: translate(-50%, -40px) rotate(-15deg) scale(0.95); }
  75%  { transform: translate(calc(-50% - 160px), -120px) rotate(10deg) scale(1.05); }
  100% { transform: translate(-50%, 0) rotate(-8deg) scale(1); }
}

/* Continuous raining mini trolls */
.mini-troll {
  position: fixed;
  top: -120px;
  width: 60px;
  height: auto;
  z-index: 5;
  opacity: 0.85;
  pointer-events: none;
  animation: trollRain linear forwards;
}

@keyframes trollRain {
  to {
    transform: translateY(140vh) rotate(1440deg);
  }
}
</style>
</head>
<body>
  <div class="interstitial-wrapper">
    <div class="icon"></div>
    <div id="main-message">
      <h1><span>This site can’t be reached</span></h1>
      <p><strong>exophs.vercel.app</strong>'s DNS address could not be found. Diagnosing the problem.</p>
      <div class="error-code">DNS_PROBE_POSSIBLE</div>
    </div>
    <div class="nav-wrapper suggested-left">
      <div id="control-buttons">
        <button id="troll-button">Reload</button>
      </div>
    </div>
  </div>

  <img id="trollface" src="https://upload.wikimedia.org/wikipedia/en/7/73/Trollface.png" alt="Trollface">
  <audio id="audio" src="https://github.com/exophs/exophs-site/raw/refs/heads/main/music/you've%20been%20trolled.mp3"></audio>

  <script>
    const trollButton = document.getElementById('troll-button');
    const trollface = document.getElementById('trollface');
    const audio = document.getElementById('audio');

    function createMiniTroll() {
      const mini = document.createElement('img');
      mini.src = "https://upload.wikimedia.org/wikipedia/en/7/73/Trollface.png";
      mini.className = 'mini-troll';
      
      mini.style.left = Math.random() * 100 + 'vw';
      mini.style.width = (35 + Math.random() * 55) + 'px';
      mini.style.animationDuration = (2.5 + Math.random() * 5) + 's';
      mini.style.opacity = 0.5 + Math.random() * 0.5;
      
      document.body.appendChild(mini);
      
      // Remove after it falls off screen
      setTimeout(() => mini.remove(), 12000);
    }

    trollButton.addEventListener('click', () => {
      trollButton.textContent = "You've been trolled!";
      trollButton.style.pointerEvents = 'none';

      trollface.classList.add('show');

      trollface.addEventListener('transitionend', function handler(e) {
        if (e.propertyName === 'bottom' || e.propertyName === 'width') {
          trollface.classList.add('dancing');
          audio.play().catch(() => {});

          // Start continuous troll rain
          createMiniTroll(); // initial ones
          setInterval(createMiniTroll, 120); // spawn new ones regularly

          trollface.removeEventListener('transitionend', handler);
        }
      });
    });
  </script>
</body>
</html>
