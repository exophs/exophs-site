<!DOCTYPE html>
<html dir="ltr" lang="en">
<head>
<meta charset="utf-8">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#fff">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>exophs.vercel.app</title>
<style>
body {
  --background-color: #fff;
  --error-code-color: rgb(95, 99, 104);
  --google-gray-300: rgb(218, 220, 224);
  --google-gray-500: rgb(154, 160, 166);
  --google-gray-50: rgb(248, 249, 250);
  --google-gray-600: rgb(128, 134, 139);
  --google-gray-700: rgb(95, 99, 104);
  --google-gray-900: rgb(32, 33, 36);
  --heading-color: var(--google-gray-900);
  --link-color: rgb(88, 88, 88);
  --primary-color: #4a46e0;
  --primary-color-hover: #251491;
  --primary-button-fill-color-active: var(--primary-color-hover);
  --primary-button-fill-color: var(--primary-color);
  --primary-button-text-color: #fff;
  --secondary-button-border-color: var(--google-gray-500);
  --secondary-button-fill-color: #fff;
  --secondary-button-hover-border-color: var(--google-gray-600);
  --secondary-button-hover-fill-color: var(--google-gray-50);
  --secondary-button-text-color: var(--google-gray-700);
  --text-color: var(--google-gray-700);
  background: var(--background-color);
  color: var(--text-color);
  word-wrap: break-word;
  margin: 0;
  font-family: 'Segoe UI', Tahoma, sans-serif;
  font-size: 75%;
}

@media (prefers-color-scheme: dark) {
  body {
    --background-color: rgb(32, 33, 36);
    --error-code-color: var(--google-gray-500);
    --heading-color: var(--google-gray-500);
    --link-color: rgb(138, 180, 248);
    --primary-color: #c1c4ff;
    --primary-color-hover: #dfe1ff;
    --primary-button-text-color: rgb(32, 33, 36);
    --secondary-button-border-color: var(--google-gray-700);
    --secondary-button-fill-color: rgb(32, 33, 36);
    --secondary-button-hover-fill-color: rgb(48, 51, 57);
    --secondary-button-text-color: rgb(138, 180, 248);
    --text-color: var(--google-gray-500);
  }
}

html {
  -webkit-text-size-adjust: 100%;
  font-size: 125%;
}

.icon {
  height: 72px;
  margin: 0 0 40px;
  width: 72px;
  -webkit-user-select: none;
  display: inline-block;
  background-repeat: no-repeat;
  background-size: 100%;
  content: image-set(
    url(data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAEgAAABIAQMAAABvIyEEAAAABlBMVEUAAABTU1OoaSf/AAAAAXRSTlMAQObYZgAAAENJREFUeF7tzbEJACEQRNGBLeAasBCza2lLEGx0CxFGG9hBMDDxRy/72O9FMnIFapGylsu1fgoBdkXfUHLrQgdfrlJN1BdYBjQQm3UAAAAASUVORK5CYII=) 1x,
    url(data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAJAAAACQAQMAAADdiHD7AAAABlBMVEUAAABTU1OoaSf/AAAAAXRSTlMAQObYZgAAAFJJREFUeF7t0cENgDAMQ9FwYgxG6WjpaIzCCAxQxVggFuDiCvlLOeRdHR9yzjncHVoq3npu+wQUrUuJHylSTmBaespJyJQoObUeyxDQb3bEm5Au81c0pSCD8HYAAAAASUVORK5CYII=) 2x
  );
}

@media (prefers-color-scheme: dark) {
  .icon {
    filter: invert(1);
  }
}

h1 {
  color: var(--heading-color);
  font-size: 1.6em;
  font-weight: normal;
  line-height: 1.25em;
  margin: 0 0 16px;
  word-wrap: break-word;
}

h1 span {
  font-weight: 500;
}

.error-code {
  color: var(--error-code-color);
  font-size: .8em;
  margin-top: 12px;
  text-transform: uppercase;
}

.interstitial-wrapper {
  box-sizing: border-box;
  font-size: 1em;
  line-height: 1.6em;
  margin: 14vh auto 0;
  max-width: 600px;
  width: 100%;
}

#main-message > p {
  display: inline;
  margin: 0;
}

.nav-wrapper {
  margin-top: 51px;
}

.nav-wrapper::after {
  clear: both;
  content: '';
  display: table;
  width: 100%;
}

.suggested-left > #control-buttons {
  float: left;
}

button {
  background: var(--primary-button-fill-color);
  border: 0;
  border-radius: 20px;
  box-sizing: border-box;
  color: var(--primary-button-text-color);
  cursor: pointer;
  float: right;
  font-size: .875em;
  margin: 0;
  padding: 9px;
  transition: box-shadow 150ms cubic-bezier(0.4, 0, 0.2, 1);
  user-select: none;
}

button:active {
  background: var(--primary-button-fill-color-active);
  outline: 0;
}

@media (max-width: 420px) {
  button {
    float: none;
    font-size: .825em;
    font-weight: 500;
    margin: 0;
    width: 100%;
    padding: 16px 24px;
  }

  .interstitial-wrapper {
    padding: 0 5%;
    margin: 7vh auto 12px;
  }

  h1 {
    font-size: 1.5em;
    margin-bottom: 8px;
  }

  .icon {
    margin-bottom: 5.69vh;
  }

  .nav-wrapper {
    margin-top: 30px;
  }
}
</style>
</head>
<body>
  <div class="interstitial-wrapper">
    <div class="icon"></div>
    <div id="main-message">
      <h1><span>This site can’t be reached</span></h1>
      <p><strong>exophs.vercel.app</strong>'s DNS address could not be found. Diagnosing the problem.</p>
      <div class="error-code">DNS_PROBE_POSSIBLE</div>
    </div>
    <div class="nav-wrapper suggested-left">
      <div id="control-buttons">
        <button id="reload-button" class="blue-button text-button" onclick="location.reload()">Reload</button>
      </div>
    </div>
  </div>
</body>
</html>
